<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="refresh" content="8;url=/">
  <title>Not Found — CycleCore Technologies</title>

  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:opsz,wght@14..32,300..600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --border: rgba(255,255,255,0.06);
      --text: #f0f0f0;
      --text-2: #707070;
      --text-3: #404040;
      --accent: #0099bb;
      --accent-dim: rgba(0, 212, 255, 0.08);
      --serif: 'Instrument Serif', Georgia, serif;
      --sans: 'Inter', -apple-system, sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      padding: 2rem;
    }

    .container {
      text-align: center;
      max-width: 400px;
      opacity: 0;
      animation: fade-in 0.8s ease-out 0.15s forwards;
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .code {
      font-family: var(--mono);
      font-size: 0.625rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 2.5rem;
    }

    h1 {
      font-family: var(--serif);
      font-size: clamp(2.5rem, 8vw, 4rem);
      font-weight: 400;
      letter-spacing: -0.03em;
      line-height: 1;
      color: var(--text);
      margin-bottom: 1rem;
    }

    .sub {
      font-size: 0.9375rem;
      line-height: 1.6;
      color: var(--text-2);
      margin-bottom: 3rem;
    }

    .redirect {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1rem 0;
      border-top: 1px solid var(--border);
    }

    .bar-track {
      width: 120px;
      height: 2px;
      background: var(--surface);
      border-radius: 1px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 1px;
      animation: fill 8s linear 0.3s forwards;
    }

    @keyframes fill {
      to { width: 100%; }
    }

    .redirect-text {
      font-family: var(--mono);
      font-size: 0.625rem;
      letter-spacing: 0.06em;
      color: var(--text-3);
    }

    .home-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 2rem;
      font-family: var(--mono);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      color: var(--text-2);
      text-decoration: none;
      padding: 0.5rem 1.25rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      transition: all 0.25s ease;
    }

    .home-link:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-dim);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">404 &mdash; Not Found</div>
    <h1>Nothing here.</h1>
    <p class="sub">This page doesn't exist or has been moved.</p>
    <div class="redirect">
      <div class="bar-track"><div class="bar-fill"></div></div>
      <span class="redirect-text">Redirecting</span>
    </div>
    <a href="/" class="home-link">Go home &#8594;</a>
  </div>
</body>
</html>
