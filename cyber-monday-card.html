<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Cyber Monday Launch - Maaza API</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        
        body {
            margin: 0;
            padding: 20px;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .card {
            width: 1200px;
            height: 628px;
            background: linear-gradient(135deg, #000000 0%, #0a0a1a 100%);
            font-family: 'JetBrains Mono', monospace;
            color: #00FFFF;
            padding: 50px 60px;
            border: 4px solid #00FFFF;
            box-shadow: 0 0 60px rgba(0, 255, 255, 0.5);
            position: relative;
            overflow: hidden;
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 255, 255, 0.03) 2px,
                rgba(0, 255, 255, 0.03) 4px
            );
            pointer-events: none;
        }
        
        .terminal-header {
            font-size: 14px;
            color: #00AAAA;
            margin-bottom: 20px;
            opacity: 0.9;
            position: relative;
            z-index: 1;
        }
        
        .brand {
            font-size: 18px;
            letter-spacing: 4px;
            margin-bottom: 8px;
        }
        
        .cyber-badge {
            position: absolute;
            top: 40px;
            right: 60px;
            background: #FF0066;
            color: #FFFFFF;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 2px;
            transform: rotate(3deg);
            box-shadow: 0 0 30px rgba(255, 0, 102, 0.6);
        }
        
        .title {
            font-size: 72px;
            font-weight: 700;
            text-align: center;
            margin: 25px 0 15px 0;
            text-shadow: 0 0 30px rgba(0, 255, 255, 0.8);
            letter-spacing: 3px;
            position: relative;
            z-index: 1;
        }
        
        .subtitle {
            font-size: 28px;
            text-align: center;
            margin-bottom: 35px;
            color: #FFFFFF;
            position: relative;
            z-index: 1;
        }
        
        .features {
            display: flex;
            gap: 30px;
            margin: 30px 0;
            position: relative;
            z-index: 1;
        }
        
        .feature-box {
            flex: 1;
            background: rgba(0, 255, 255, 0.05);
            border: 2px solid #00FFFF;
            padding: 25px;
            text-align: center;
        }
        
        .feature-stat {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 8px;
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }
        
        .feature-label {
            font-size: 14px;
            color: #00DDDD;
            letter-spacing: 1px;
        }
        
        .promo {
            text-align: center;
            margin: 35px 0 25px 0;
            position: relative;
            z-index: 1;
        }
        
        .promo-text {
            font-size: 26px;
            color: #FF0066;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(255, 0, 102, 0.5);
        }
        
        .footer {
            text-align: center;
            padding-top: 20px;
            border-top: 2px solid rgba(0, 255, 255, 0.4);
            position: relative;
            z-index: 1;
        }
        
        .link {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .tagline {
            font-size: 14px;
            color: #00AAAA;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="cyber-badge">CYBER MONDAY</div>
        
        <div class="terminal-header">
            <div class="brand">CYCLECORE.AI</div>
            <div>$ npm install @cyclecore/maaza</div>
        </div>
        
        <div class="title">MAAZA API</div>
        
        <div class="subtitle">
            Edge-Optimized JSON Extraction • Now Live
        </div>
        
        <div class="features">
            <div class="feature-box">
                <div class="feature-stat">83%</div>
                <div class="feature-label">ACCURACY ON SIMPLE SCHEMAS</div>
            </div>
            
            <div class="feature-box">
                <div class="feature-stat">~3s</div>
                <div class="feature-label">AVG LATENCY</div>
            </div>
            
            <div class="feature-box">
                <div class="feature-stat">$49</div>
                <div class="feature-label">STARTER / 10K REQUESTS</div>
            </div>
        </div>
        
        <div class="promo">
            <div class="promo-text">🎁 JSON JOKE CONTEST — Win Free API Access!</div>
        </div>
        
        <div class="footer">
            <div class="link">cyclecore.ai/research</div>
            <div class="tagline">STRUCTURED DATA EXTRACTION FOR THE EDGE</div>
        </div>
    </div>
</body>
</html>
